<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Cricket Scores</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Roboto', sans-serif; margin: 0; background: #f0f2f5; color: #333; }
  header { background: #2c3e50; color: #fff; padding: 20px; text-align: center; font-size: 2em; font-weight: 700; }
  .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
  .filters { text-align:center; margin-bottom:20px; }
  .filters button { padding:10px 20px; margin:5px; border:none; border-radius:5px; cursor:pointer; font-weight:700; background:#e67e22; color:white; }
  .filters button:hover { background:#d35400; }
  .match-card { background:#fff; border-radius:12px; padding:20px; margin-bottom:15px; box-shadow:0 2px 6px rgba(0,0,0,0.1); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; transition:transform 0.2s; }
  .match-card:hover { transform:translateY(-3px); box-shadow:0 6px 12px rgba(0,0,0,0.15); }
  .match-info { display:flex; align-items:center; flex-wrap:wrap; }
  .team-logo { width:50px; height:50px; margin-right:10px; }
  .teams { font-size:1.2em; font-weight:700; }
  .score { color:#27ae60; margin-top:5px; }
  .status { font-style:italic; color:#888; margin-top:5px; }
  .countdown { font-weight:700; color:#c0392b; margin-top:5px; }
  .bet-btn { background-color: #e67e22; color: white; padding: 10px 20px; border:none; border-radius:8px; cursor:pointer; font-weight:700; margin-top:10px; transition:background-color 0.2s; }
  .bet-btn:hover { background-color:#d35400; }
  @media(max-width:600px){ .match-card{flex-direction:column;text-align:center;} .bet-btn{width:100%;} }
</style>
</head>
<body>

<header>Live Cricket Scores</header>

<div class="container">
  <div class="filters">
    <button onclick="filterMatches('IPL')">IPL</button>
    <button onclick="filterMatches('International')">International</button>
    <button onclick="filterMatches('Domestic')">Domestic</button>
    <button onclick="filterMatches('All')">All</button>
  </div>
  <div id="matches"></div>
</div>

<script>
const apiUrl = 'https://cricket-api.vercel.app/cricScore'; // Free public API
let allMatches = [];

function getCountdown(startTime) {
  const now = new Date().getTime();
  const matchTime = new Date(startTime).getTime();
  const diff = matchTime - now;
  if(diff<=0) return "Live!";
  const hours = Math.floor(diff/(1000*60*60));
  const minutes = Math.floor((diff%(1000*60*60))/(1000*60));
  const seconds = Math.floor((diff%(1000*60))/1000);
  return `${hours}h ${minutes}m ${seconds}s`;
}

async function fetchMatches() {
  try{
    const res = await fetch(apiUrl);
    const data = await res.json();
    allMatches = Object.keys(data).map(name=>{
      return {
        name,
        score: data[name].score || 'Score not available',
        status: data[name].status || 'Upcoming',
        type: data[name].type || 'All', // placeholder type
        startTime: data[name].start_time || new Date().toISOString(), // placeholder
        team1Logo: 'https://via.placeholder.com/50', // placeholder logos
        team2Logo: 'https://via.placeholder.com/50'
      };
    });
    renderMatches('All');
  }catch(err){
    document.getElementById('matches').innerHTML = "<p style='text-align:center;color:red;'>Unable to load matches.</p>";
  }
}

function renderMatches(filter){
  const container = document.getElementById('matches');
  container.innerHTML='';
  allMatches.filter(m=>filter==='All'||m.type===filter).forEach(match=>{
    const card = document.createElement('div');
    card.className='match-card';
    card.innerHTML=`
      <div class="match-info">
        <img class="team-logo" src="${match.team1Logo}" alt="Team 1">
        <img class="team-logo" src="${match.team2Logo}" alt="Team 2">
        <div>
          <div class="teams">${match.name}</div>
          <div class="score">${match.score}</div>
          <div class="status">${match.status}</div>
          <div class="countdown">${getCountdown(match.startTime)}</div>
        </div>
      </div>
      <button class="bet-btn" onclick="alert('Bet feature coming soon!')">Click to Bet</button>
    `;
    container.appendChild(card);
  });
}

function filterMatches(type){
  renderMatches(type);
}

// Refresh matches every 15 seconds
setInterval(fetchMatches,15000);
fetchMatches();
</script>

</body>
</html>
